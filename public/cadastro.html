<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Cadastrar · Estoque de Contas</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="topbar">
    <h1>Cadastrar conta</h1>
    <p>Adicione uma nova conta ao estoque</p>
  </div>

  <main>
    <form id="form">
      <div class="field">
        <label for="game">Jogo</label>
        <input id="game" required />
      </div>
      <div class="field">
        <label for="username">Nome / login da conta</label>
        <input id="username" required />
      </div>
      <div class="field">
        <label for="password">Senha</label>
        <input id="password" type="text" required />
      </div>
      <div class="field">
        <label for="price">Preço (R$)</label>
        <input id="price" type="number" min="0" step="0.01" required />
      </div>
      <div class="field">
        <label for="status">Status inicial</label>
        <select id="status">
          <option value="DISPONIVEL">Disponível</option>
          <option value="RESERVADA">Reservada</option>
          <option value="BRINDE">Brinde</option>
        </select>
      </div>
      <div class="field">
        <label for="level">Nível / progresso (opcional)</label>
        <input id="level" />
      </div>
      <div class="field">
        <label for="contents">Conteúdo da conta (opcional)</label>
        <textarea id="contents"></textarea>
      </div>
      <div class="field">
        <label for="notes">Observações (opcional)</label>
        <textarea id="notes"></textarea>
      </div>

      <button class="primary" type="submit" id="submit-btn">Salvar conta</button>
      <div class="login-error" id="feedback"></div>
    </form>
  </main>

  <nav class="tabbar" id="tabbar"></nav>

  <script src="/js/api.js"></script>
  <script src="/js/nav.js"></script>
  <script>
    renderNav("cadastro");
    requireSession();

    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const feedback = document.getElementById("feedback");
      const btn = document.getElementById("submit-btn");
      feedback.textContent = "";
      feedback.style.color = "var(--danger)";
      btn.disabled = true;

      try {
        const payload = {
          game: document.getElementById("game").value.trim(),
          username: document.getElementById("username").value.trim(),
          password: document.getElementById("password").value,
          price: Number(document.getElementById("price").value),
          status: document.getElementById("status").value,
          level: document.getElementById("level").value.trim() || undefined,
          contents: document.getElementById("contents").value.trim() || undefined,
          notes: document.getElementById("notes").value.trim() || undefined,
        };

        await api("/api/accounts", { method: "POST", body: JSON.stringify(payload) });
        feedback.style.color = "var(--green)";
        feedback.textContent = "Conta cadastrada com sucesso.";
        document.getElementById("form").reset();
      } catch (err) {
        feedback.textContent = err.message;
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
